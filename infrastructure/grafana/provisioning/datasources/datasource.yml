apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: embedded_telemetry
    user: telemetry
    secureJsonData:
      password: telemetry_dev_password
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    editable: false
