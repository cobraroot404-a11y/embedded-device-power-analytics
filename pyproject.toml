[project]
name = "embedded-device-power-analytics"
version = "0.1.0"
description = "Production-style IoT telemetry platform for embedded-device usage, power-state, reliability and energy-efficiency analytics."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
env = [
    "GAP_THRESHOLD_MINUTES=30",
]

[tool.setuptools]
packages = ["app", "simulator"]
